# Dedicated, disposable services for tests. Never points at development volumes.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: intelligixl
      POSTGRES_PASSWORD: intelligixl
      POSTGRES_DB: intelligixl_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligixl -d intelligixl_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
