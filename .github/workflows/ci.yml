name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: intelligixl
          POSTGRES_PASSWORD: intelligixl
          POSTGRES_DB: intelligixl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelligixl -d intelligixl_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://intelligixl:intelligixl@127.0.0.1:5432/intelligixl_test
      REDIS_URL: redis://127.0.0.1:6379/15
      LOCAL_STORAGE_DIR: /tmp/intelligixl-test/storage
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm audit --prod --audit-level=high
